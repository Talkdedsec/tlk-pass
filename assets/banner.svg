<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="TLK Pass — offline password generator, one HTML file, no dependencies">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e08a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00b4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00b4ff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00e08a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0a0b0f"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#glow2)"/>

  <g transform="translate(80 96)">
    <circle cx="9" cy="9" r="9" fill="#00e08a"/>
    <circle cx="9" cy="9" r="17" fill="none" stroke="#00e08a" stroke-opacity=".28" stroke-width="2"/>
  </g>

  <text x="122" y="115" font-family="Segoe UI, system-ui, sans-serif" font-size="52" font-weight="700" fill="#e7e9ee" letter-spacing="1">TLK Pass</text>
  <text x="122" y="156" font-family="Consolas, ui-monospace, monospace" font-size="19" fill="#8b90a0">crypto.getRandomValues · rejection sampling · no network</text>

  <g font-family="Consolas, ui-monospace, monospace" font-size="17">
    <g transform="translate(122 196)">
      <rect width="196" height="38" rx="10" fill="#12141b" stroke="#242835"/>
      <text x="18" y="24" fill="#00e08a">one HTML file</text>
    </g>
    <g transform="translate(334 196)">
      <rect width="212" height="38" rx="10" fill="#12141b" stroke="#242835"/>
      <text x="18" y="24" fill="#00b4ff">zero dependencies</text>
    </g>
    <g transform="translate(562 196)">
      <rect width="168" height="38" rx="10" fill="#12141b" stroke="#242835"/>
      <text x="18" y="24" fill="#8b90a0">works offline</text>
    </g>
  </g>

  <g font-family="Consolas, ui-monospace, monospace" font-size="15" fill="#2f3444" opacity=".9">
    <text x="812" y="92">q7$Vn2#Lm8*Rt4</text>
    <text x="812" y="122" fill="#242835">deniz-kartal-safir-nova</text>
    <text x="812" y="152" fill="#2f3444">8•2•4•9•1•7</text>
    <text x="812" y="182" fill="#242835">Xk9!pZ3@wQ6&amp;fH</text>
  </g>
  <rect x="800" y="70" width="4" height="126" rx="2" fill="#00e08a" opacity=".45"/>
</svg>
