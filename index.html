<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>TLK Pass — offline password generator</title>
<meta name="description" content="Password, passphrase and PIN generator that runs entirely in your browser. One HTML file, no dependencies, no network, randomness from the Web Crypto API.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0b0f">
<meta property="og:type" content="website">
<meta property="og:title" content="TLK Pass">
<meta property="og:description" content="Offline password generator. One HTML file, no dependencies, no network.">
<meta property="og:url" content="https://talkdedsec.github.io/tlk-pass/">
<meta property="og:image" content="https://talkdedsec.github.io/tlk-pass/assets/og.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0f'/%3E%3Ccircle cx='12' cy='16' r='5.5' fill='none' stroke='%2300e08a' stroke-width='3'/%3E%3Cpath d='M17 16h9M22 16v5M26 16v4' stroke='%2300e08a' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#08090c; --panel:#0f1116; --panel2:#151821; --line:#1f2330; --line2:#2c3142;
    --txt:#eceef3; --dim:#8a90a1; --faint:#5a6072; --accent:#00e08a; --accent2:#00b4ff;
    --warn:#ff4d5e; --mid:#ffb020; --radius:20px;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,sans-serif;
    --out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:
      radial-gradient(900px 520px at 18% -10%,rgba(0,224,138,.09),transparent 60%),
      radial-gradient(900px 600px at 100% 110%,rgba(0,180,255,.08),transparent 60%),
      var(--bg);
    color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    padding:clamp(16px,3vw,40px);
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
  ::selection{background:var(--accent);color:#04120c}
  .app{max-width:1180px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:clamp(20px,3vw,36px)}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
  .brand b{font-weight:800;font-size:16px;letter-spacing:-.01em}
  .brand span{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .brand .lang{margin-left:auto;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:11px}
  .brand .lang button{background:none;border:0;color:var(--dim);border-radius:999px;padding:4px 10px;cursor:pointer;transition:.2s}
  .brand .lang button.on{color:#04120c;background:var(--txt)}

  .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
  .card{background:linear-gradient(180deg,var(--panel),#0c0e13);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,2.4vw,30px)}

  /* the stage: the password is the hero */
  .stage{position:sticky;top:clamp(16px,3vw,40px);display:flex;flex-direction:column;min-height:min(560px,calc(100vh - 140px))}
  .stage-k{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
  .out{position:relative;flex:1;display:flex;align-items:center;padding:clamp(20px,3vw,36px) 0;min-height:200px}
  #pw{font-family:var(--mono);font-weight:500;line-height:1.18;word-break:break-all;user-select:all;letter-spacing:-.01em;
    font-size:var(--pw-size,clamp(26px,4vw,48px));transition:font-size .4s var(--out)}
  #pw span{display:inline-block;transition:color .3s}
  #pw .d{color:var(--accent2)} #pw .s{color:var(--mid)} #pw .u{color:var(--accent)}
  #pw .x{color:var(--faint)}
  .actions{display:flex;gap:8px}
  .ico{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--txt);cursor:pointer;transition:.2s var(--out);font-size:13px;font-weight:600}
  .ico:hover{border-color:var(--dim);transform:translateY(-1px)}
  .ico:active{transform:none}
  .ico svg{width:17px;height:17px}
  .ico.copied{color:#04120c;background:var(--accent);border-color:var(--accent)}
  .ico.reroll-spin svg{animation:spin .5s var(--out)}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* strength: a log scale from "instant" to "forever", the needle sits at the entropy */
  .scale{position:relative;margin:22px 0 12px;padding-top:18px}
  .meter{display:flex;gap:4px}
  .meter i{height:6px;flex:1;border-radius:4px;background:#1b1f2a;transition:background .35s}
  .ticks{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--faint)}
  .needle{position:absolute;top:0;left:0;transform:translateX(-50%);transition:left .6s var(--out);display:flex;flex-direction:column;align-items:center}
  .needle::before{content:"";width:2px;height:28px;background:var(--txt);border-radius:2px}
  .meta{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 24px;align-items:end}
  #label{font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.02em}
  .meta .stat{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .meta .stat b{display:block;white-space:nowrap;font-size:20px;color:var(--txt);font-weight:600;letter-spacing:-.01em;text-transform:none;margin-top:2px}

  .gen{margin-top:26px;width:100%;padding:18px;border:none;border-radius:14px;cursor:pointer;
    font-size:16px;font-weight:800;color:#04120c;letter-spacing:-.01em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:transform .25s var(--out),filter .2s;
    display:flex;align-items:center;justify-content:center;gap:10px}
  .gen:hover{filter:brightness(1.08);transform:translateY(-2px)}
  .gen:active{transform:scale(.99)}
  .gen svg{width:18px;height:18px}
  .gen kbd{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;background:rgba(4,18,12,.18)}

  /* controls */
  .tabs{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:#0a0c10;border:1px solid var(--line);margin-bottom:22px}
  .tabs .slide{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:10px;background:var(--panel2);box-shadow:0 2px 12px rgba(0,0,0,.5);transition:transform .45s var(--out)}
  .tab{position:relative;background:none;border:0;padding:11px 6px;font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;transition:color .2s}
  .tab.on{color:var(--txt)}
  .sec-k{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:4px 0 10px}

  .lenwrap{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:4px 0 20px}
  .lenval{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1;min-width:2ch;text-align:right;letter-spacing:-.04em}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline-offset:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent2)) 0/var(--fill,50%) 100% no-repeat,#1b1f2a}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;cursor:grab;box-shadow:0 2px 10px rgba(0,0,0,.6);border:4px solid var(--bg)}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--bg);cursor:grab}

  .chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
  .chip{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0b0d12;cursor:pointer;transition:border-color .2s,background .2s,transform .3s var(--out)}
  .chip:hover{transform:translateY(-2px)}
  .chip input{position:absolute;opacity:0;width:0;height:0}
  .chip .g{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--faint);transition:color .2s;letter-spacing:.02em}
  .chip .n{font-size:13px;color:var(--dim)}
  .chip::after{content:"";position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);transition:.2s}
  .chip:has(input:checked){border-color:rgba(0,224,138,.45);background:rgba(0,224,138,.05)}
  .chip:has(input:checked) .g{color:var(--txt)}
  .chip:has(input:checked)::after{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(0,224,138,.6)}
  .chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:3px}
  .chip.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;padding-right:44px}
  .chip.wide::after{top:50%;margin-top:-7px}
  .chip.wide .g{font-size:15px}

  .row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-top:1px solid var(--line)}
  .row label{font-size:14px}
  .row .hint{display:block;font-size:11px;color:var(--dim);margin-top:2px;font-family:var(--mono)}
  .sw{position:relative;width:46px;height:26px;flex:none}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw .track{position:absolute;inset:0;background:#232837;border-radius:20px;transition:.25s;cursor:pointer}
  .sw .track::before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s var(--out)}
  .sw input:checked+.track{background:var(--accent)}
  .sw input:checked+.track::before{transform:translateX(20px)}
  .sw input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:3px}
  select{background:var(--panel2);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-family:var(--mono);cursor:pointer}
  .seg{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#0a0c10}
  .seg button{background:none;border:0;color:var(--dim);border-radius:9px;padding:7px 14px;cursor:pointer;font-family:var(--mono);font-weight:700;transition:.2s}
  .seg button.on{color:#04120c;background:var(--accent)}

  .bulk{margin-top:16px;display:none;flex-direction:column;gap:6px}
  .bulk.on{display:flex}
  .bulk .item{display:flex;align-items:center;gap:10px;background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--mono);font-size:14px;animation:rise .4s var(--out) both}
  .bulk .item:nth-child(n){animation-delay:calc(var(--i,0)*35ms)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .bulk .item span{flex:1;word-break:break-all;user-select:all}
  .bulk .item button{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px}
  .bulk .item button:hover{color:var(--accent)}
  .bulk .item button svg{width:15px;height:15px}
  .bulk .copyall{background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:10px;padding:11px;cursor:pointer;font-family:var(--mono);font-size:13px;transition:.15s}
  .bulk .copyall:hover{border-color:var(--accent)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--accent);color:#04120c;font-weight:700;
    padding:12px 20px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.35s var(--out);font-family:var(--mono);z-index:9}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:20px;font-size:11px;color:var(--dim);font-family:var(--mono);line-height:1.7}
  .foot kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:var(--mono)}
  .foot .csp{color:var(--faint)}
  .hidden{display:none}

  @media (max-width:520px){.meta{grid-template-columns:1fr 1fr}.meta #label{grid-column:1/-1}}
  @media (max-width:880px){
    .grid{grid-template-columns:minmax(0,1fr)}
    .stage{position:static;min-height:0}
    .out{min-height:140px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <span class="dot"></span><b>TLK&nbsp;Pass</b><span id="tag" data-t="tag">// secure password generator</span>
    <span class="lang"><button data-lang="tr" class="on">TR</button><button data-lang="en">EN</button></span>
  </div>
  <main class="grid">
    <section class="card stage" aria-label="Result">
      <div class="stage-k"><span>crypto.getRandomValues</span><span id="kind">—</span></div>
      <div class="out"><div id="pw" aria-live="polite"></div></div>
      <div class="actions">
        <button class="ico" id="copy" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span data-t="copy">Copy</span></button>
        <button class="ico" id="reroll" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span data-t="reroll">Reroll</span></button>
      </div>
      <div class="scale">
        <div class="needle" id="needle" aria-hidden="true"></div>
        <div class="meter" id="meter"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="ticks" aria-hidden="true"><span>0</span><span>40</span><span>60</span><span>80</span><span>110</span><span>128+ bit</span></div>
      </div>
      <div class="meta">
        <span id="label">—</span>
        <span class="stat"><span data-t="ent">entropy</span><b><span id="ent">0</span> bit</b></span>
        <span class="stat"><span data-t="crack">crack</span><b id="crack">—</b></span>
      </div>
      <button class="gen" id="gen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <span data-t="btn">Generate</span><kbd>Enter</kbd>
      </button>
      <div class="bulk" id="bulk"></div>
    </section>

    <section class="card ctrl" aria-label="Options">
      <div class="tabs" role="tablist">
        <span class="slide" aria-hidden="true"></span>
        <button class="tab on" role="tab" aria-selected="true" data-mode="chars" data-t="mChars">Characters</button>
        <button class="tab" role="tab" aria-selected="false" data-mode="phrase" data-t="mPhrase">Passphrase</button>
        <button class="tab" role="tab" aria-selected="false" data-mode="pin" data-t="mPin">PIN</button>
      </div>

      <div id="charOpts">
        <div class="lenwrap">
          <input type="range" id="len" min="6" max="64" value="20" aria-label="Length">
          <span class="lenval" id="lenval">20</span>
        </div>
        <div class="chips">
          <label class="chip"><input type="checkbox" id="oUp" checked><span class="g">ABC</span><span class="n" data-t="oUp">Uppercase</span></label>
          <label class="chip"><input type="checkbox" id="oLow" checked><span class="g">abc</span><span class="n" data-t="oLow">Lowercase</span></label>
          <label class="chip"><input type="checkbox" id="oNum" checked><span class="g">123</span><span class="n" data-t="oNum">Digits</span></label>
          <label class="chip"><input type="checkbox" id="oSym" checked><span class="g">#$%</span><span class="n" data-t="oSym">Symbols</span></label>
          <label class="chip wide"><input type="checkbox" id="oAmb"><span class="n" data-t="oAmb">Exclude ambiguous</span><span class="g">O0 Il1 |</span></label>
        </div>
      </div>

      <div id="phraseOpts" class="hidden">
        <div class="lenwrap">
          <input type="range" id="words" min="3" max="10" value="5" aria-label="Words">
          <span class="lenval" id="wordsval">5</span>
        </div>
        <div class="row"><label for="sep" data-t="sep">Separator</label>
          <select id="sep">
            <option value="-">-</option><option value=".">.</option>
            <option value="_">_</option><option value=" ">␣</option>
          </select></div>
        <div class="row"><label for="pCap" data-t="pCap">Capitalize each word</label>
          <span class="sw"><input type="checkbox" id="pCap" checked><span class="track"></span></span></div>
        <div class="row"><label for="pNum" data-t="pNum">Append digits</label>
          <span class="sw"><input type="checkbox" id="pNum" checked><span class="track"></span></span></div>
      </div>

      <div id="pinOpts" class="hidden">
        <div class="lenwrap">
          <input type="range" id="pinLen" min="3" max="12" value="6" aria-label="Digits">
          <span class="lenval" id="pinLenval">6</span>
        </div>
      </div>

      <div class="row">
        <span data-t="count">Count</span>
        <div class="seg" id="count">
          <button data-n="1" class="on">1</button><button data-n="5">5</button><button data-n="10">10</button>
        </div>
      </div>
      <div class="row">
        <label for="autoclear"><span data-t="autoclear">Clear clipboard after 15s</span><span class="hint" data-t="autoclearHint">wipes the copied password</span></label>
        <span class="sw"><input type="checkbox" id="autoclear" checked><span class="track"></span></span></div>
    </section>
  </main>
  <div class="foot">
    <div><span data-t="foot1">fully on-device</span> · <span data-t="foot2">no server</span> · <span class="csp">connect-src 'none'</span></div>
    <div><kbd>Enter</kbd> <span data-t="k1">reroll</span> · <kbd>Ctrl+C</kbd> <span data-t="k2">copy</span></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>

const SETS={up:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",low:"abcdefghijklmnopqrstuvwxyz",num:"0123456789",sym:"!@#$%^&*()-_=+[]{};:,.<>?/"};

  tr:"zaman deniz yildiz orman kartal ejder gece gunes ruzgar firtina cinar demir gumus altin cesur bilge kaya nehir sema kutup panter sahin volkan golge kristal lav mermer safir yakut zumrut atlas kobalt titan neon prizma vektor matris kuantum foton nova pulsar galaksi meteor komet asteroit hidra kobra puma lynx bizon ceylan doruk zirve fener kule liman koru bahar yaprak tohum kok dal filiz sarmasik zumruduanka simsek yagmur kar buz alev toprak gokyuzu bulut dalga mercan inci lotus manolya orkide zambak menekse lale karanfil papatya nilufer akasya kestane mese kavak selvi ardic sedir".split(" ")
};

const I18N={
  en:{tag:"// secure password generator",ent:"entropy",crack:"crack",mChars:"Characters",mPhrase:"Passphrase",mPin:"PIN",
    oUp:"Uppercase",oLow:"Lowercase",oNum:"Digits",oSym:"Symbols",oAmb:"Exclude ambiguous",sep:"Separator",
    pCap:"Capitalize each word",pNum:"Append digits",count:"Count",autoclear:"Clear clipboard after 15s",
    autoclearHint:"wipes the copied password",btn:"Generate",foot1:"fully on-device",foot2:"no server",

    oUp:"Büyük harf",oLow:"Küçük harf",oNum:"Rakam",oSym:"Sembol",oAmb:"Karışanları hariç tut",sep:"Ayraç",
    pCap:"Her kelimeyi büyük başlat",pNum:"Sona rakam ekle",count:"Adet",autoclear:"Panoyu 15 sn sonra temizle",
    autoclearHint:"kopyalanan şifreyi siler",btn:"Şifre Üret",foot1:"tamamı cihazında",foot2:"sunucu yok",
    k1:"yenile",k2:"kopyala",copied:"Kopyalandı ✓",copiedAll:"Hepsi kopyalandı ✓",cleared:"Pano temizlendi",
    pick:"en az bir set seçin",reroll:"Yenile",copy:"Kopyala",
    lv:["Zayıf","Orta","İyi","Güçlü","Çok Güçlü"],
    inst:"anında",secs:"saniye",mins:"dakika",hours:"saat",days:"gün",years:"yıl",cent:"yüzyıl",eons:"sonsuz",copyAll:"Hepsini kopyala"}
};

const $=id=>document.getElementById(id);
const rand=n=>{const max=Math.floor(0xffffffff/n)*n;const b=new Uint32Array(1);do{crypto.getRandomValues(b)}while(b[0]>=max);return b[0]%n;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

let mode="chars", count=1, clearTimer=null;
// Turkish for Turkish browsers, English otherwise, until the user picks one.
let lang=(navigator.language||"").toLowerCase().startsWith("tr")?"tr":"en", langChosen=false;
const L=()=>I18N[lang];

function loadPrefs(){
  try{const p=JSON.parse(localStorage.getItem("tlkpass")||"{}");
    // Older versions stored the Turkish default as p.lang on every save, so only "en" there was a choice.
    const saved=p.language==="en"||p.language==="tr"?p.language:p.lang==="en"?"en":null;
    if(saved){lang=saved;langChosen=true}
    if(p.len)$("len").value=p.len;
    if(p.words)$("words").value=p.words;
    if(p.pinLen)$("pinLen").value=p.pinLen;
    if(p.sep)$("sep").value=p.sep;
    ["oUp","oLow","oNum","oSym","oAmb","pCap","pNum","autoclear"].forEach(k=>{if(k in p)$(k).checked=p[k]});
  }catch{}
}
function savePrefs(){
  const p={len:$("len").value,words:$("words").value,pinLen:$("pinLen").value,sep:$("sep").value};
  if(langChosen)p.language=lang;
  ["oUp","oLow","oNum","oSym","oAmb","pCap","pNum","autoclear"].forEach(k=>p[k]=$(k).checked);
  localStorage.setItem("tlkpass",JSON.stringify(p));
}

function buildPool(){
  let pool="";const req=[];
  if($("oUp").checked){pool+=SETS.up;req.push(SETS.up)}
  if($("oLow").checked){pool+=SETS.low;req.push(SETS.low)}
  if($("oNum").checked){pool+=SETS.num;req.push(SETS.num)}
  if($("oSym").checked){pool+=SETS.sym;req.push(SETS.sym)}
  if($("oAmb").checked){
    pool=[...pool].filter(c=>!AMB.has(c)).join("");
    for(let i=0;i<req.length;i++)req[i]=[...req[i]].filter(c=>!AMB.has(c)).join("");
  }
  return {pool,req:req.filter(s=>s.length)};
}
function genChars(){
  const {pool,req}=buildPool();if(!pool)return "";
  const len=+$("len").value,out=[];
  for(const s of req){if(out.length<len)out.push(s[rand(s.length)])}
  while(out.length<len)out.push(pool[rand(pool.length)]);
  return shuffle(out).join("");
}
function genPhrase(){
  const n=+$("words").value,sep=$("sep").value,cap=$("pCap").checked,parts=[];
  for(let i=0;i<n;i++){let w=WORDS[lang][rand(WORDS[lang].length)];if(cap)w=w[0].toUpperCase()+w.slice(1);parts.push(w)}
  let out=parts.join(sep);if($("pNum").checked)out+=sep+(rand(90)+10);return out;
}
function genPin(){let s="";const n=+$("pinLen").value;for(let i=0;i<n;i++)s+=rand(10);return s}
function gen(){return mode==="chars"?genChars():mode==="phrase"?genPhrase():genPin()}

function entropy(pw){
  if(mode==="phrase"){let b=(+$("words").value)*Math.log2(WORDS[lang].length);if($("pNum").checked)b+=Math.log2(90);return b}
  if(mode==="pin")return (+$("pinLen").value)*Math.log2(10);
  const p=buildPool().pool.length;return p>1?pw.length*Math.log2(p):0;
}
function crackTime(bits){
  const guesses=Math.pow(2,bits)/2, perSec=1e11, s=guesses/perSec, t=L();
  if(s<1)return t.inst;
  const u=[[31536000*100,t.cent],[31536000,t.years],[86400,t.days],[3600,t.hours],[60,t.mins],[1,t.secs]];
  if(s>31536000*1e6)return t.eons;
  for(const [d,name] of u){if(s>=d){const v=s/d;return (v>=100?Math.round(v):v>=10?Math.round(v):v.toFixed(1))+" "+name}}
  return t.inst;
}

function paint(el,pw){
  el.innerHTML="";
  for(const ch of pw){const s=document.createElement("span");
    if(/[0-9]/.test(ch))s.className="d";else if(/[A-Z]/.test(ch))s.className="u";else if(/[a-z]/.test(ch))s.className="";else s.className="s";
    s.textContent=ch;el.appendChild(s)}
}
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
let revealRun=0;
function reveal(pw){
  const el=$("pw");
  el.style.setProperty("--pw-size",pw.length>40?"clamp(18px,2.4vw,28px)":pw.length>24?"clamp(22px,3.2vw,38px)":"clamp(28px,4.6vw,56px)");
  paint(el,pw);
  if(reduceMotion)return;
  // cosmetic only: the glyphs shown while settling are not part of the password
  const spans=[...el.children],glyphs="ABCDEFGHJKMNPQRSTXYZ23456789#$%&*@",my=++revealRun,t0=performance.now();
  const tick=now=>{
    if(my!==revealRun)return;
    let busy=false;
    spans.forEach((s,i)=>{
      const done=now-t0>140+i*(260/spans.length);
      if(done){if(s.dataset.c!==undefined){s.textContent=s.dataset.c;s.className=s.dataset.k;delete s.dataset.c}}
      else{busy=true;if(s.dataset.c===undefined){s.dataset.c=s.textContent;s.dataset.k=s.className}
        s.textContent=glyphs[rand(glyphs.length)];s.className="x"}
    });
    if(busy)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function updateStrength(pw){
  const bits=Math.round(entropy(pw));$("ent").textContent=bits;$("crack").textContent=crackTime(bits);
  let lvl,col;
  if(bits<40){lvl=1;col="var(--warn)"}else if(bits<60){lvl=2;col="var(--mid)"}
  else if(bits<80){lvl=3;col="var(--accent2)"}else if(bits<110){lvl=4;col="var(--accent)"}else{lvl=5;col="var(--accent)"}
  $("label").textContent=L().lv[lvl-1];$("label").style.color=col;
  [...$("meter").children].forEach((b,i)=>b.style.background=i<lvl?col:"#1b1f2a");
  // ticks sit at 0/40/60/80/110/128+, so the needle maps bits onto those five equal steps
  const stops=[0,40,60,80,110,128],k=stops.findIndex((v,i)=>i===stops.length-1||bits<stops[i+1]);
  const pos=k>=stops.length-1?100:(k+(bits-stops[k])/(stops[k+1]-stops[k]))*20;
  $("needle").style.left=Math.min(100,pos)+"%";
}

function generate(){
  savePrefs();
  const first=gen();
  if(!first){$("pw").textContent=L().pick;$("ent").textContent=0;$("crack").textContent="—";
    $("label").textContent="—";[...$("meter").children].forEach(b=>b.style.background="#20242f");$("bulk").classList.remove("on");return}
  reveal(first);updateStrength(first);
  $("kind").textContent=(mode==="chars"?L().mChars:mode==="phrase"?L().mPhrase:L().mPin)+" · "+first.length;
  const bulk=$("bulk");bulk.innerHTML="";
  if(count>1){
    bulk.classList.add("on");
    const all=[first];for(let i=1;i<count;i++)all.push(gen());
    all.forEach((p,i)=>{
      const row=document.createElement("div");row.className="item";row.style.setProperty("--i",i);
      const sp=document.createElement("span");paint(sp,p);
      const btn=document.createElement("button");btn.title=L().copy;
      btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      btn.onclick=()=>copyText(p);
      row.append(sp,btn);bulk.appendChild(row)});
    const ca=document.createElement("button");ca.className="copyall";ca.textContent="⧉ "+L().copyAll;
    ca.onclick=()=>copyText(all.join("\n"),L().copiedAll);bulk.appendChild(ca);
  }else bulk.classList.remove("on");
}

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800)}

async function copyText(text,msg){
  if(!text)return;
  try{await navigator.clipboard.writeText(text)}
  catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
  toast(msg||L().copied);
  if($("autoclear").checked){
    clearTimeout(clearTimer);
    clearTimer=setTimeout(async()=>{try{await navigator.clipboard.writeText("")}catch{}toast(L().cleared)},15000);
  }
}
function copyMain(){const pw=$("pw").textContent;if(!pw||pw===L().pick)return;
  const c=$("copy");c.classList.add("copied");setTimeout(()=>c.classList.remove("copied"),900);copyText(pw)}

function applyLang(){
  const t=L();document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(t[k])el.textContent=t[k]});
  $("reroll").title=t.reroll;$("copy").title=t.copy;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  generate();
}

const fill=r=>r.style.setProperty("--fill",(r.value-r.min)/(r.max-r.min)*100+"%");
["len","words","pinLen"].forEach(id=>{const r=$(id);fill(r);r.addEventListener("input",()=>fill(r))});
$("len").oninput=e=>{$("lenval").textContent=e.target.value;generate()};
$("words").oninput=e=>{$("wordsval").textContent=e.target.value;generate()};
$("pinLen").oninput=e=>{$("pinLenval").textContent=e.target.value;generate()};
["oUp","oLow","oNum","oSym","oAmb","pCap","pNum","autoclear"].forEach(id=>$(id).onchange=generate);
$("sep").onchange=generate;$("gen").onclick=generate;$("reroll").onclick=()=>{const r=$("reroll");r.classList.remove("reroll-spin");void r.offsetWidth;r.classList.add("reroll-spin");generate()};$("copy").onclick=copyMain;

document.querySelectorAll(".tab").forEach(tb=>tb.onclick=()=>{
  const tabs=[...document.querySelectorAll(".tab")];tabs.forEach(x=>{x.classList.toggle("on",x===tb);x.setAttribute("aria-selected",x===tb)});mode=tb.dataset.mode;
  document.querySelector(".tabs .slide").style.transform="translateX("+tabs.indexOf(tb)*100+"%)";
  $("charOpts").classList.toggle("hidden",mode!=="chars");
  $("phraseOpts").classList.toggle("hidden",mode!=="phrase");
  $("pinOpts").classList.toggle("hidden",mode!=="pin");generate();
});
$("count").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  $("count").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");count=+b.dataset.n;generate()});
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;langChosen=true;savePrefs();applyLang()});

addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT")return;
  if(e.key==="Enter"){e.preventDefault();generate()}
  if((e.ctrlKey||e.metaKey)&&e.key==="c"&&!getSelection().toString()){copyMain()}
});

loadPrefs();
$("lenval").textContent=$("len").value;$("wordsval").textContent=$("words").value;$("pinLenval").textContent=$("pinLen").value;
["len","words","pinLen"].forEach(id=>fill($(id)));
applyLang();
</script>
</body>
</html>
